name: Update changelog

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate CHANGELOG.md
        run: |
          {
            echo "# Changelog"
            echo ""
            echo "Auto-generated from commit history. Do not edit by hand."
            echo ""
            git log --pretty=format:"- **%ad** — %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" --date=short -n 100
          } > CHANGELOG.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "Update CHANGELOG.md [skip ci]"
          git push
